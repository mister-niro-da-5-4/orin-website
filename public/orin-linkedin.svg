<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <!-- Background -->
  <rect width="400" height="400" fill="#030303"/>

  <!-- Ambient glow -->
  <circle cx="200" cy="185" r="80" fill="#FF4F00" opacity="0.06"/>

  <!-- Outer ring -->
  <circle cx="200" cy="185" r="88" stroke="#FF4F00" stroke-width="2.5" fill="none"/>

  <!-- Orbital ring -->
  <ellipse cx="200" cy="185" rx="75" ry="30" stroke="#FF4F00" stroke-width="1.2" stroke-opacity="0.3" fill="none" transform="rotate(-30 200 185)"/>

  <!-- Core sphere gradient -->
  <defs>
    <radialGradient id="sphere" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffad73"/>
      <stop offset="40%" stop-color="#FF4F00"/>
      <stop offset="100%" stop-color="#7a2500"/>
    </radialGradient>
  </defs>

  <!-- Core sphere -->
  <circle cx="200" cy="185" r="22" fill="url(#sphere)"/>

  <!-- Specular highlight -->
  <circle cx="194" cy="179" r="5" fill="white" opacity="0.45"/>

  <!-- Glow ring -->
  <circle cx="200" cy="185" r="22" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- ORIN text -->
  <text x="200" y="310" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" letter-spacing="8">ORIN</text>

  <!-- LXDS subtitle -->
  <text x="200" y="338" text-anchor="middle" fill="#666666" font-family="ui-monospace, monospace" font-weight="400" font-size="11" letter-spacing="5">LXDS</text>
</svg>
